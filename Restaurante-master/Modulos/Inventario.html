<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
  
    <link rel="stylesheet" href="../CSS/Inventario.css">


</head>
<body>
    <h1>Modulo Inventario</h1>
    <hr>
    <form action="">
        
        <label for="">categoria:</label>
        <input type="text" id="id_categoria" required placeholder="Ingrese la categoria que requiere">
        <br>

        <label for="">nombre del producto:</label>
        <input type="text" id="id_nombre_producto" required placeholder="Ingrese el nombre del producto">
        <br>

       <label for="">descricion del producto:</label>
        <input type="text" id="id_descripcion_producto" required placeholder="Ingrese una descripcion">
        <br>

        <label for="">codigo del producto:</label>
        <input type="number" id="id_codigo_producto" required placeholder="Ingrese el codigo del producto">
        <br>

        <label for="">cantidad del producto:</label>
        <input type="number" id="id_cantidad_producto" required placeholder="Ingrese la cantidad del producto">
        <br>

        <label for="">precio unitario del producto:</label>
        <input type="number" id="id_precio_unitario_producto" required placeholder="Ingrese el precio unitario">
        <br>

        <label for="">provedor del producto:</label>
        <input type="text" id="id_provedor_producto" required placeholder="Ingrese el nombre del provedor producto">
        <br>


        <a href="../index.html">Volver al inicio</a>
        <button type="submit" id="btnGuardar">Guardar</button>


    </form>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/inventario.js"></script>
</body>
</html>
