<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    
    <title>Pedidos</title>
   <link rel="stylesheet" href="../CSS/Pedidos.css">

</head>
<body>
    <h1>Modulo Pedidos</h1>
    <hr>
    <form action="">
        
        <label for="">Producto:</label>
        <input type="text" id="id_producto" required placeholder="Ingrese el producto">
        <br>

        <label for="">Dirección:</label>
        <input type="number" id="id_direccion" required placeholder="Ingrese su direccion">
        <br>

        <label for="">Nombre del usuario:</label>
        <input type="text" id="Nombre_usuario" required placeholder="Ingrese su nombre de usuario">
        <br>

        <label for="">Cantidad:</label>
        <input type="number" id="id_cantidad" required placeholder="Ingrese la cantidad">
        <br>

        <label for="">Metodo de pago:</label>
        <input type="text" id="id_metodo_pago" required placeholder="Ingrese su metodo de pago">
        <br>

        <label for="">Telefono:</label>
        <input type="number" id="id_Telefono" required placeholder="Ingrese su Telefono">
        <br>


        <a href="../index.html">Volver al inicio</a>
        <button type="submit" id="btnGuardar">Guardar</button>


    </form>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="../js/pedidos.js"></script>
</body>
</html>
